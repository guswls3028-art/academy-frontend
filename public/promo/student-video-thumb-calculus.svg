<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">함수와 그래프 핵심 풀이 수업 표지</title>
  <desc id="desc">칠판 느낌의 짙은 남색 배경에 함수 그래프와 수업 제목이 표시된 예시 영상 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091826"/>
      <stop offset="0.58" stop-color="#102d3b"/>
      <stop offset="1" stop-color="#0b202a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9bd9df" stroke-opacity=".1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1440" height="810" rx="42" fill="url(#bg)"/>
  <rect x="48" y="48" width="1344" height="714" rx="34" fill="url(#grid)" stroke="#b9edf0" stroke-opacity=".2" stroke-width="3"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="110" y="154" fill="#5eead4" font-size="30" font-weight="700">고2 내신 심화반 · 1차시</text>
    <text x="110" y="262" fill="#f8fafc" font-size="76" font-weight="800">함수와 그래프</text>
    <text x="110" y="350" fill="#f8fafc" font-size="76" font-weight="800">핵심 풀이</text>
    <text x="112" y="425" fill="#b8c9d4" font-size="30" font-weight="500">개념 확인부터 서술형 풀이까지</text>
    <rect x="110" y="520" width="252" height="62" rx="31" fill="#f6c453"/>
    <text x="236" y="561" fill="#10202c" text-anchor="middle" font-size="25" font-weight="800">POINT 01</text>
    <text x="390" y="561" fill="#d9e7ec" font-size="28" font-weight="600">그래프 이동과 접선의 방정식</text>
