name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      controlled_write_canaries:
        description: "통제 번호만 사용하는 가입/복구/OMR/과제/클리닉 운영 쓰기 canary 실행"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "e2e/**"
      - "e2e-wrong-note-harness.html"
      - "index.html"
      - "package.json"
      - "playwright.config.ts"
      - "vite.config.ts"

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E maintained release suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # PR 또는 수동 실행에서만 동작 (push에서는 quality-gate.yml이 처리)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Guard production E2E safety boundaries
        run: pnpm guard:e2e-safety

      - name: Select E2E API proxy boundary
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          if [ "${PR_AUTHOR}" = "dependabot[bot]" ]; then
            echo "VITE_DEV_PROXY_TARGET=http://127.0.0.1:9" >> "${GITHUB_ENV}"
          else
            echo "VITE_DEV_PROXY_TARGET=${TRUSTED_E2E_API_URL:-https://api.hakwonplus.com}" >> "${GITHUB_ENV}"
          fi

      - name: Start checkout frontend
        run: |
          pnpm dev --host 127.0.0.1 --port 5174 --strictPort > /tmp/academy-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/academy-vite.log
          exit 1

      - name: Create .env.e2e
        if: >-
          github.event_name == 'workflow_dispatch'
          || github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          cat > .env.e2e << EOF
          # PR checkout의 실제 UI를 검증하고 API만 운영 E2E tenant로 proxy한다.
          E2E_BASE_URL=http://127.0.0.1:5174
          E2E_LOCAL_BASE_URL=http://127.0.0.1:5174
          E2E_API_URL=${{ secrets.E2E_API_URL || 'https://api.hakwonplus.com' }}
          E2E_TENANT_CODE=hakwonplus
          E2E_ADMIN_USER=${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASS=${{ secrets.E2E_ADMIN_PASS }}
          E2E_STUDENT_USER=${{ secrets.E2E_STUDENT_USER }}
          E2E_STUDENT_PASS=${{ secrets.E2E_STUDENT_PASS }}
          TCHUL_BASE_URL=https://tchul.com
          TCHUL_ADMIN_USER=${{ secrets.TCHUL_ADMIN_USER }}
          TCHUL_ADMIN_PASS=${{ secrets.TCHUL_ADMIN_PASS }}
          SSWE_BASE_URL=https://sswe.co.kr
          DNB_BASE_URL=https://dnbacademy.co.kr
          DNB_ADMIN_USER=${{ secrets.DNB_ADMIN_USER }}
          DNB_ADMIN_PASS=${{ secrets.DNB_ADMIN_PASS }}
          LIMGLISH_BASE_URL=https://limglish.kr
          LIMGLISH_ADMIN_USER=${{ secrets.LIMGLISH_ADMIN_USER }}
          LIMGLISH_ADMIN_PASS=${{ secrets.LIMGLISH_ADMIN_PASS }}
          # console.error/pageerror는 PR을 실패시킨다. 명시적 예외만 marker로 허용한다.
          E2E_STRICT=strict
          # PR/전체 suite는 provider 실발송 금지. 전용 수동 canary만 1로 실행한다.
          E2E_ALLOW_REAL_ALIMTALK=0
          E2E_ALLOW_PRODUCTION_WRITES=0
          EOF

      - name: Run PR E2E gate
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm test:e2e:gate --reporter=github,html

      - name: Run Dependabot secretless route-mock gate
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          E2E_BASE_URL: http://127.0.0.1:5174
          E2E_LOCAL_BASE_URL: http://127.0.0.1:5174
          E2E_STRICT: strict
          E2E_ALLOW_REAL_ALIMTALK: "0"
          E2E_ALLOW_PRODUCTION_WRITES: "0"
        run: |
          mapfile -t MOCK_SPECS < <(
            find e2e -type f -name '*.mock.spec.ts' \
              ! -path '*/_archive/*' ! -path '*/_local/*' | sort
          )
          if [ "${#MOCK_SPECS[@]}" -eq 0 ]; then
            echo "::error::No active route-mock specs found"
            exit 1
          fi
          pnpm exec playwright test "${MOCK_SPECS[@]}" \
            --project=chromium --reporter=github,html

      - name: Run maintained release E2E suite
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e:release --reporter=github,html

      - name: Run opt-in controlled production write canaries
        if: github.event_name == 'workflow_dispatch' && inputs.controlled_write_canaries
        env:
          E2E_ALLOW_PRODUCTION_WRITES: "1"
          E2E_ALLOW_SIGNUP_APPROVAL_REAL_SEND: "1"
          E2E_SIGNUP_CONTROLLED_PHONE: "01031217466"
          E2E_ALLOW_ACCOUNT_RECOVERY_REAL_SEND: "1"
          E2E_ACCOUNT_RECOVERY_CONTROLLED_PHONE: "01031217466"
          E2E_ALLOW_PASSWORD_RESET_REAL_NOTIFICATIONS: "1"
          E2E_ALLOW_CLINIC_REAL_NOTIFICATIONS: "1"
          E2E_CLINIC_CONTROLLED_PHONE: "01031217466"
          E2E_ALLOW_HOMEWORK_REAL_NOTIFICATIONS: "1"
          E2E_HOMEWORK_CONTROLLED_PHONE: "01031217466"
        run: >-
          pnpm exec playwright test
          e2e/flows/signup-approval-roundtrip.spec.ts
          e2e/auth/account-recovery-realuse.spec.ts
          e2e/flows/password-reset-roundtrip.spec.ts
          e2e/flows/notice-roundtrip.spec.ts
          e2e/flows/qna-roundtrip.spec.ts
          e2e/flows/clinic-roundtrip.spec.ts
          e2e/admin/session-assessment-realuse.spec.ts
          e2e/admin/omr-review-realuse.spec.ts
          e2e/student/homework-submission-realuse.spec.ts
          e2e/student/clinic-remediation-realuse.spec.ts
          --reporter=github,html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-maintained-release
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload frontend server log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-server-log-maintained-release
          path: /tmp/academy-vite.log
          retention-days: 7
          if-no-files-found: ignore

  all-menu-audit:
    name: All-menu audit (${{ matrix.scope }})
    if: github.event_name == 'workflow_dispatch' && needs.e2e.result == 'success'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # These read-only audits share the production E2E tenant. Keep them
      # sequential to avoid authentication throttling and cross-run noise.
      max-parallel: 1
      matrix:
        include:
          - scope: admin-dev-desktop
            grep: '관리자 \+ 개발자 데스크톱 메뉴/버튼'
          - scope: student-mobile
            grep: "학생 모바일 메뉴/버튼"
          - scope: teacher-mobile
            grep: "선생님 모바일 메뉴/버튼"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Guard production E2E safety boundaries
        run: pnpm guard:e2e-safety

      - name: Start checkout frontend
        env:
          VITE_DEV_PROXY_TARGET: ${{ secrets.E2E_API_URL || 'https://api.hakwonplus.com' }}
        run: |
          pnpm dev --host 127.0.0.1 --port 5174 --strictPort > /tmp/academy-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/academy-vite.log
          exit 1

      - name: Create .env.e2e
        run: |
          cat > .env.e2e << EOF
          E2E_BASE_URL=http://127.0.0.1:5174
          E2E_LOCAL_BASE_URL=http://127.0.0.1:5174
          E2E_API_URL=${{ secrets.E2E_API_URL || 'https://api.hakwonplus.com' }}
          E2E_TENANT_CODE=hakwonplus
          E2E_ADMIN_USER=${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASS=${{ secrets.E2E_ADMIN_PASS }}
          E2E_STUDENT_USER=${{ secrets.E2E_STUDENT_USER }}
          E2E_STUDENT_PASS=${{ secrets.E2E_STUDENT_PASS }}
          E2E_STRICT=strict
          E2E_ALLOW_REAL_ALIMTALK=0
          E2E_ALLOW_PRODUCTION_WRITES=0
          EOF

      - name: Run exhaustive read-only menu audit
        run: >-
          pnpm exec playwright test
          e2e/stability/all-menu-button-click-audit.spec.ts
          --grep "${{ matrix.grep }}"
          --reporter=github,html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.scope }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload frontend server log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-server-log-${{ matrix.scope }}
          path: /tmp/academy-vite.log
          retention-days: 7
          if-no-files-found: ignore
