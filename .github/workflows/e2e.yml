name: Public YouTube boundary diagnostic (temporary branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-player:
    if: github.ref == 'refs/heads/codex/godmin-video-01a135b7-frontend-20261014-021702'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --shamefully-hoist
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec playwright test --config=scripts/tests/fixtures/playwright.public-video-probe.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-video-probe
          path: test-results/public-video-probe.jsonl
          retention-days: 7
