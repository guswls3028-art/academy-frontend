name: Frontend Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hangul-companion-check:
    name: Hangul companion Windows COM contract
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Build Windows companion release
        run: dotnet build desktop/hangul-companion/Academy.HangulCompanion.csproj -c Release
      - name: Verify Windows COM insertion contract
        run: dotnet run --project desktop/hangul-companion-integration-tests/Academy.HangulCompanion.IntegrationTests.csproj -c Release

  # ── 1. 빌드 품질 게이트 (차단) ──
  quality-check:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Cloudflare Git builds expose the same commit as CF_PAGES_COMMIT_SHA.
      # Using a shared commit version keeps dual build outputs deterministic.
      VITE_BUILD_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # R-11 changed-files lint step에서 HEAD~1 또는 origin/main 비교 — 충분한 history 필요.
          fetch-depth: 50
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      # 차단 게이트: 타입 에러 = 배포 차단
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

      - name: API and E2E safety contract guards
        run: pnpm guard:legacy-api

      # warning-only: 기존 lint 에러 존재. 점진 수정 후 차단으로 승격 예정.
      - name: Lint (warning-only, full repo)
        run: pnpm lint || echo "::warning::Lint errors found"
        continue-on-error: true

      # 차단 게이트: R-11 인라인 스타일 baseline 동결 + 신규 차단 (4-30~).
      # 변경된 .ts/.tsx 만 --max-warnings 0 강제. baseline 5,543건은 통과, 신규 인라인 스타일은 fail.
      # PR: origin/main...HEAD diff. push: HEAD~1..HEAD diff (직전 커밋이 거쳐온 PR).
      # 변경 파일 0개면 skip.
      - name: Lint changed files (strict, R-11 baseline 동결)
        run: |
          set -e
          git fetch origin main --depth=50 2>/dev/null || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 'e2e/**/*.ts' || true)
          if [ -z "$CHANGED" ]; then
            echo "변경된 .ts/.tsx 없음 — skip"
            exit 0
          fi
          echo "변경 파일 lint (--max-warnings 0):"
          echo "$CHANGED"
          pnpm exec eslint --max-warnings 0 $CHANGED

      - name: Wrong-note async lifecycle contract
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm dev --host 127.0.0.1 --port 5174 --strictPort > /tmp/wrong-note-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5174/e2e-wrong-note-harness.html > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/wrong-note-vite.log
              exit 1
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:5174 \
            pnpm exec playwright test \
              e2e/admin/wrong-note-generation-contract.mock.spec.ts \
              --project=chromium \
              --reporter=list

      - name: Workspace routing and PWA contracts
        run: |
          pnpm exec playwright test \
            e2e/root-routing-contract.spec.ts \
            e2e/pwa-branding-contract.spec.ts \
            --project=chromium \
            --reporter=list

      # 차단 게이트: 빌드 실패 = 서비스 장애
      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-bundle
          path: |
            dist/
            functions/
            src/core/router/workspaceRoutes.ts
          retention-days: 1

  # ── 2. 동일 산출물 Cloudflare preview 검증 (운영 도메인 영향 없음) ──
  candidate-preview:
    name: Cloudflare candidate preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-check, hangul-companion-check]
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deploy-bundle

      - name: Verify Functions bundle exists
        run: |
          if [ ! -f functions/\[\[path\]\].ts ]; then
            echo "::error::functions/[[path]].ts missing — preview cannot match production"
            exit 1
          fi
          if [ ! -f src/core/router/workspaceRoutes.ts ]; then
            echo "::error::workspaceRoutes.ts missing — Functions import cannot be bundled"
            exit 1
          fi
          if ! grep -q 'data-omr-canonical-route="/workspace/tools/omr"' \
            dist/omr-sheet.html; then
            echo "::error::Built OMR compatibility page has the wrong canonical target"
            exit 1
          fi

      - name: Deploy and verify isolated preview
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          CANDIDATE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_PROJECT_NAME}" ]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME is not configured"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PREVIEW_BRANCH="route-pr-${PR_NUMBER}"
          else
            PREVIEW_BRANCH="production-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          npx wrangler@4.93.1 pages deploy dist/ \
            --project-name="${CLOUDFLARE_PROJECT_NAME}" \
            --branch="${PREVIEW_BRANCH}" \
            --commit-hash="${CANDIDATE_SHA}" \
            --commit-dirty=false

          AUTH=(
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}"
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}"
          )
          DEPLOYMENTS_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/deployments"
          PREVIEW_URL=""
          for ATTEMPT in $(seq 1 30); do
            RESPONSE=$(curl --silent --show-error --fail-with-body \
              "${AUTH[@]}" "${DEPLOYMENTS_API}?env=preview&per_page=25")
            PREVIEW_URL=$(jq -r --arg sha "${CANDIDATE_SHA}" \
              '.result[]
                | select(.deployment_trigger.metadata.commit_hash == $sha)
                | select(.latest_stage.status == "success")
                | .url' <<<"${RESPONSE}" | head -1)
            if [ -n "${PREVIEW_URL}" ] && [ "${PREVIEW_URL}" != "null" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "${PREVIEW_URL}" ] || [ "${PREVIEW_URL}" = "null" ]; then
            echo "::error::Could not resolve the successful candidate preview URL"
            exit 1
          fi
          echo "Candidate preview: ${PREVIEW_URL}"

          EXPECTED_VERSION=$(node -p \
            "JSON.parse(require('fs').readFileSync('dist/version.json', 'utf8')).version")
          if [ "${EXPECTED_VERSION}" != "${CANDIDATE_SHA}" ]; then
            echo "::error::Candidate artifact version does not match the checked-out revision"
            exit 1
          fi
          ACTUAL_VERSION=""
          for ATTEMPT in $(seq 1 60); do
            ACTUAL_VERSION=$(curl --silent --show-error \
              "${PREVIEW_URL}/version.json?candidate=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}" \
              | jq -r '.version // empty' 2>/dev/null || true)
            if [ "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}" ]; then
              break
            fi
            sleep 5
          done
          if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Preview version did not propagate: expected ${EXPECTED_VERSION}, got ${ACTUAL_VERSION}"
            exit 1
          fi

          fetch_body_matching() {
            local URL="$1"
            local EXPECTED_TEXT="$2"
            local BODY=""
            for ATTEMPT in $(seq 1 100); do
              if BODY=$(curl --silent --show-error --fail-with-body --location "${URL}") \
                && grep -qF "${EXPECTED_TEXT}" <<<"${BODY}"; then
                printf '%s' "${BODY}"
                return 0
              fi
              sleep 3
            done
            echo "::error::Preview content did not propagate: ${URL}" >&2
            return 1
          }

          for PATHNAME in \
            "/" \
            "/workspace" \
            "/workspace/mobile" \
            "/admin?candidate=legacy-full-root" \
            "/admin/dashboard?candidate=legacy-full" \
            "/admin/tools/omr?candidate=legacy-omr" \
            "/teacher?candidate=legacy-mobile-root" \
            "/teacher/classes?candidate=legacy-mobile"; do
            fetch_body_matching "${PREVIEW_URL}${PATHNAME}" 'id="root"' > /dev/null
          done

          MANIFEST=$(fetch_body_matching \
            "${PREVIEW_URL}/teacher-manifest.json" \
            '"start_url": "/workspace/mobile"')
          if [ "$(jq -r '.id' <<<"${MANIFEST}")" != "/teacher" ] \
            || [ "$(jq -r '.start_url' <<<"${MANIFEST}")" != "/workspace/mobile" ] \
            || [ "$(jq -r '.scope' <<<"${MANIFEST}")" != "/workspace/mobile" ]; then
            echo "::error::Preview mobile workspace manifest contract failed"
            exit 1
          fi

          SW_HEADERS=""
          for ATTEMPT in $(seq 1 100); do
            if SW_HEADERS=$(curl --silent --show-error --fail-with-body \
              --dump-header - --output /dev/null "${PREVIEW_URL}/teacher-sw.js") \
              && grep -qi '^Service-Worker-Allowed: /' <<<"${SW_HEADERS}"; then
              break
            fi
            sleep 3
          done
          if ! grep -qi '^Service-Worker-Allowed: /' <<<"${SW_HEADERS}"; then
            echo "::error::Preview teacher service worker scope header is missing"
            exit 1
          fi

          OMR=$(fetch_body_matching \
            "${PREVIEW_URL}/omr-sheet.html" \
            'OMR 답안지 생성기로 이동')
          if ! grep -Eq 'data-omr-canonical-route="/(workspace|admin)/tools/omr"' <<<"${OMR}"; then
            echo "::error::Preview OMR page has no safe builder target"
            exit 1
          fi
          if grep -q 'onerror="alert(1)' <<<"${OMR}" \
            || grep -q 'cdnjs.cloudflare.com' <<<"${OMR}" \
            || grep -q 'id="root"' <<<"${OMR}"; then
            echo "::error::Preview OMR compatibility page safety contract failed"
            exit 1
          fi

  # ── 3. Cloudflare 운영 배포 (preview 통과 후) ──
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality-check, hangul-companion-check, candidate-preview]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      baseline_deployment_id: ${{ steps.production-baseline.outputs.deployment_id }}
      baseline_version: ${{ steps.production-baseline.outputs.version }}
      production_branch: ${{ steps.production-baseline.outputs.production_branch }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deploy-bundle

      - name: Verify Functions bundle exists
        run: |
          if [ ! -f functions/\[\[path\]\].ts ]; then
            echo "::error::functions/[[path]].ts missing — CF Functions will not deploy!"
            exit 1
          fi
          if [ ! -f src/core/router/workspaceRoutes.ts ]; then
            echo "::error::workspaceRoutes.ts missing — Functions import cannot be bundled"
            exit 1
          fi
          echo "✅ Functions bundle found"

      - name: Capture production baseline and deployment ownership
        id: production-baseline
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH=(
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}"
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}"
          )
          PROJECT_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            "${AUTH[@]}" "${PROJECT_API}")
          if ! jq -e '.success == true' >/dev/null <<<"${RESPONSE}"; then
            echo "::error::Could not read the Cloudflare Pages production baseline"
            exit 1
          fi

          PRODUCTION_BRANCH=$(jq -r '.result.production_branch // empty' <<<"${RESPONSE}")
          SOURCE_TYPE=$(jq -r '.result.source.type // "direct-upload"' <<<"${RESPONSE}")
          if [ "${SOURCE_TYPE}" != "direct-upload" ]; then
            AUTO_PROD=$(jq -r \
              '.result.source.config.production_deployments_enabled // "missing"' \
              <<<"${RESPONSE}")
            LEGACY_AUTO=$(jq -r \
              '.result.source.config.deployments_enabled // "missing"' \
              <<<"${RESPONSE}")
            if [ "${AUTO_PROD}" != "false" ] && [ "${LEGACY_AUTO}" != "false" ]; then
              RESERVED_PRODUCTION_BRANCH="github-actions-production"
              if [ "${PRODUCTION_BRANCH}" != "${RESERVED_PRODUCTION_BRANCH}" ]; then
                echo "::error::Cloudflare Git production auto-deploy is not isolated"
                exit 1
              fi
              BRANCH_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${RESERVED_PRODUCTION_BRANCH}")
              if [ "${BRANCH_STATUS}" != "404" ]; then
                echo "::error::Reserved production branch must not exist in GitHub (status ${BRANCH_STATUS})"
                exit 1
              fi
            fi
          fi

          DEPLOYMENT_ID=$(jq -r '.result.canonical_deployment.id // empty' <<<"${RESPONSE}")
          DEPLOYMENT_STATUS=$(jq -r \
            '.result.canonical_deployment.latest_stage.status // empty' \
            <<<"${RESPONSE}")
          if [ -z "${DEPLOYMENT_ID}" ] || [ "${DEPLOYMENT_STATUS}" != "success" ]; then
            echo "::error::No successful production deployment is available for rollback"
            exit 1
          fi
          if [ -z "${PRODUCTION_BRANCH}" ]; then
            echo "::error::Cloudflare Pages production branch is not configured"
            exit 1
          fi

          BASELINE_VERSION=$(curl --silent --show-error --fail-with-body \
            "https://hakwonplus.com/version.json?baseline=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | jq -r '.version // empty')
          if [ -z "${BASELINE_VERSION}" ]; then
            echo "::error::Could not read the live production version baseline"
            exit 1
          fi

          echo "deployment_id=${DEPLOYMENT_ID}" >> "${GITHUB_OUTPUT}"
          echo "version=${BASELINE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "production_branch=${PRODUCTION_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "Production baseline ${BASELINE_VERSION} (${DEPLOYMENT_ID})"

      - name: Ensure developer console custom domain
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          DOMAIN="dev.hakwonplus.com"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains"
          AUTH=(
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}"
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}"
            -H "Content-Type: application/json"
          )

          RESPONSE=$(curl --silent --show-error --fail-with-body "${AUTH[@]}" "$API")
          if ! jq -e '.success == true' >/dev/null <<<"$RESPONSE"; then
            echo "::error::Could not read Cloudflare Pages custom domains"
            exit 1
          fi

          if ! jq -e --arg domain "$DOMAIN" '.result[]? | select(.name == $domain)' >/dev/null <<<"$RESPONSE"; then
            RESPONSE=$(curl --silent --show-error --fail-with-body \
              -X POST "${AUTH[@]}" \
              --data "$(jq -n --arg name "$DOMAIN" '{name: $name}')" \
              "$API")
            if ! jq -e '.success == true' >/dev/null <<<"$RESPONSE"; then
              echo "::error::Could not create Cloudflare Pages custom domain"
              exit 1
            fi
            echo "Created ${DOMAIN} custom domain."
          fi

          ZONE_RESPONSE=$(curl --silent --show-error --fail-with-body \
            "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=hakwonplus.com&account.id=${CLOUDFLARE_ACCOUNT_ID}&status=active")
          ZONE_ID=$(jq -r '.result[0].id // empty' <<<"$ZONE_RESPONSE")
          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not resolve the active hakwonplus.com Cloudflare zone"
            exit 1
          fi

          DNS_API="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records"
          DNS_RESPONSE=$(curl --silent --show-error --fail-with-body \
            "${AUTH[@]}" "${DNS_API}?name=${DOMAIN}")
          DNS_RECORD_ID=$(jq -r '.result[0].id // empty' <<<"$DNS_RESPONSE")
          DNS_RECORD_TYPE=$(jq -r '.result[0].type // empty' <<<"$DNS_RESPONSE")
          PROJECT_RESPONSE=$(curl --silent --show-error --fail-with-body \
            "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}")
          DNS_TARGET=$(jq -r '.result.subdomain // empty' <<<"$PROJECT_RESPONSE")
          if [ -z "$DNS_TARGET" ]; then
            echo "::error::Could not resolve the Cloudflare Pages project subdomain"
            exit 1
          fi
          DNS_PAYLOAD=$(jq -n \
            --arg name "$DOMAIN" \
            --arg content "$DNS_TARGET" \
            '{type: "CNAME", name: $name, content: $content, ttl: 1, proxied: false}')

          if [ -n "$DNS_RECORD_ID" ] && [ "$DNS_RECORD_TYPE" != "CNAME" ]; then
            echo "::error::${DOMAIN} already has a non-CNAME DNS record"
            exit 1
          elif [ -z "$DNS_RECORD_ID" ]; then
            curl --silent --show-error --fail-with-body \
              -X POST "${AUTH[@]}" --data "$DNS_PAYLOAD" "$DNS_API" >/dev/null
            echo "Created ${DOMAIN} DNS record."
          else
            CURRENT_TARGET=$(jq -r '.result[0].content // empty' <<<"$DNS_RESPONSE")
            CURRENT_PROXIED=$(jq -r '.result[0].proxied // false' <<<"$DNS_RESPONSE")
            if [ "$CURRENT_TARGET" != "$DNS_TARGET" ] || [ "$CURRENT_PROXIED" != "false" ]; then
              curl --silent --show-error --fail-with-body \
                -X PUT "${AUTH[@]}" --data "$DNS_PAYLOAD" \
                "${DNS_API}/${DNS_RECORD_ID}" >/dev/null
              echo "Updated ${DOMAIN} DNS record."
            fi
          fi

          DOMAIN_DETAIL=$(curl --silent --show-error --fail-with-body \
            "${AUTH[@]}" "${API}/${DOMAIN}")
          DOMAIN_STATUS=$(jq -r '.result.status // empty' <<<"$DOMAIN_DETAIL")
          DOMAIN_CREATED_ON=$(jq -r '.result.created_on // empty' <<<"$DOMAIN_DETAIL")
          if [ "$DOMAIN_STATUS" != "active" ] && [ -n "$DOMAIN_CREATED_ON" ]; then
            DOMAIN_AGE_SECONDS=$((
              $(date -u +%s) - $(date -u -d "$DOMAIN_CREATED_ON" +%s)
            ))
            if [ "$DOMAIN_AGE_SECONDS" -ge 900 ]; then
              curl --silent --show-error --fail-with-body \
                -X DELETE "${AUTH[@]}" "${API}/${DOMAIN}" >/dev/null
              curl --silent --show-error --fail-with-body \
                -X POST "${AUTH[@]}" \
                --data "$(jq -n --arg name "$DOMAIN" '{name: $name}')" \
                "$API" >/dev/null
              echo "Recreated stale pending ${DOMAIN} association."
            fi
          fi

          for ATTEMPT in $(seq 1 72); do
            RESPONSE=$(curl --silent --show-error --fail-with-body "${AUTH[@]}" "$API")
            STATUS=$(jq -r --arg domain "$DOMAIN" \
              '.result[]? | select(.name == $domain) | .status // empty' <<<"$RESPONSE")
            if [ "$STATUS" = "active" ] || curl --silent --show-error --fail \
              --max-time 15 --output /dev/null "https://${DOMAIN}/"; then
              echo "${DOMAIN} is serving HTTPS traffic (API status: ${STATUS:-pending})."
              exit 0
            fi
            echo "${DOMAIN} status: ${STATUS:-pending} (${ATTEMPT}/72)"
            sleep 10
          done

          DETAIL=$(curl --silent --show-error --fail-with-body \
            "${AUTH[@]}" "${API}/${DOMAIN}")
          jq -c '{
            status: .result.status,
            validation: {
              status: .result.validation_data.status,
              error: .result.validation_data.error_message
            },
            verification: {
              status: .result.verification_data.status,
              error: .result.verification_data.error_message
            }
          }' <<<"$DETAIL"
          echo "::error::${DOMAIN} did not become active within 12 minutes"
          exit 1

      - name: Deploy to Cloudflare Pages
        id: production-deploy
        run: |
          for attempt in 1 2 3; do
            echo "Cloudflare Pages deploy attempt ${attempt}/3"
            if npx wrangler@4.93.1 pages deploy dist/ \
              --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} \
              --branch="${{ steps.production-baseline.outputs.production_branch }}" \
              --commit-hash="${GITHUB_SHA}" \
              --commit-dirty=false; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done

          exit 1
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production revision propagation
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(node -p \
            "JSON.parse(require('fs').readFileSync('dist/version.json', 'utf8')).version")
          ACTUAL_VERSION=""
          for ATTEMPT in $(seq 1 60); do
            ACTUAL_VERSION=$(curl --silent --show-error \
              "https://hakwonplus.com/version.json?promotion=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}" \
              | jq -r '.version // empty' 2>/dev/null || true)
            if [ "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}" ]; then
              echo "Production revision verified at ${EXPECTED_VERSION}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production version did not propagate: expected ${EXPECTED_VERSION}, got ${ACTUAL_VERSION}"
          exit 1

      - name: Verify public product updates route (post-deploy)
        run: |
          set -euo pipefail
          RESPONSE_FILE="${RUNNER_TEMP}/product-updates.html"
          for ATTEMPT in $(seq 1 20); do
            STATUS=$(curl --silent --show-error \
              --output "${RESPONSE_FILE}" --write-out '%{http_code}' \
              "https://hakwonplus.com/promo/updates?promotion=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}" \
              || true)
            if [ "${STATUS}" = "200" ] \
              && grep -q '<title>업데이트 소식 | 학원플러스</title>' "${RESPONSE_FILE}" \
              && grep -q 'https://hakwonplus.com/promo/updates' "${RESPONSE_FILE}"; then
              echo "Public product updates route verified."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Public product updates route did not serve the deployed metadata (status ${STATUS:-unknown})"
          exit 1

      - name: Verify OG meta injection (post-deploy)
        run: |
          sleep 10
          TITLE=$(curl -s -A "kakaotalk-scrap" "https://sswe.co.kr" | grep 'og:title' | head -1)
          if echo "$TITLE" | grep -q "HakwonPlus"; then
            echo "::error::OG meta injection failed — sswe.co.kr still shows HakwonPlus"
            exit 1
          fi
          echo "✅ OG meta injection verified: $TITLE"

      - name: Verify OMR static sheet (post-deploy)
        run: |
          set -euo pipefail
          if ! grep -q 'data-omr-canonical-route="/workspace/tools/omr"' \
            dist/omr-sheet.html; then
            echo "::error::Built OMR compatibility page has the wrong canonical target"
            exit 1
          fi
          for PATHNAME in "/omr-sheet.html" "/omr-sheet"; do
            OMR=""
            OMR_FILE="${RUNNER_TEMP}/omr-sheet-response.html"
            for ATTEMPT in $(seq 1 100); do
              EFFECTIVE_URL=$(curl --silent --show-error --fail-with-body \
                --location --max-redirs 1 \
                --proto '=https' --proto-redir '=https' \
                --output "${OMR_FILE}" --write-out '%{url_effective}' \
                "https://hakwonplus.com${PATHNAME}?logo=x%22%20onerror%3D%22alert(1)&promotion=${GITHUB_RUN_ID}-${ATTEMPT}" \
                || true)
              OMR=$(cat "${OMR_FILE}" 2>/dev/null || true)
              case "${EFFECTIVE_URL}" in
                https://hakwonplus.com/omr-sheet|\
                https://hakwonplus.com/omr-sheet\?*|\
                https://hakwonplus.com/omr-sheet.html|\
                https://hakwonplus.com/omr-sheet.html\?*) ;;
                *)
                  OMR=""
                  echo "::warning::Unexpected OMR effective URL: ${EFFECTIVE_URL:-<empty>}"
                  ;;
              esac
              if grep -q 'OMR 답안지 생성기로 이동' <<<"${OMR}"; then
                break
              fi
              sleep 3
            done
            if ! grep -Eq 'data-omr-canonical-route="/(workspace|admin)/tools/omr"' <<<"${OMR}"; then
              echo "::error::OMR compatibility route missing a safe builder target at ${PATHNAME}"
              exit 1
            fi
            if grep -q 'data-omr-canonical-route="/admin/tools/omr"' <<<"${OMR}"; then
              echo "::warning::${PATHNAME} is still serving the safe legacy OMR target during edge propagation"
            fi
            if echo "$OMR" | grep -q 'onerror="alert(1)'; then
              echo "::error::OMR compatibility route reflected query input at ${PATHNAME}"
              exit 1
            fi
            if echo "$OMR" | grep -q 'cdnjs.cloudflare.com'; then
              echo "::error::OMR compatibility route loads executable third-party scripts at ${PATHNAME}"
              exit 1
            fi
            if echo "$OMR" | grep -q 'id="root"'; then
              echo "::error::OMR static sheet resolved to SPA index.html at ${PATHNAME}"
              exit 1
            fi
          done
          rm -f "${OMR_FILE}"
          echo "✅ OMR compatibility routes verified"

      - name: Verify developer console domain isolation
        run: |
          set -euo pipefail
          DEV_ORIGIN="https://dev.hakwonplus.com"

          ROOT_HEADERS=$(curl --silent --show-error --fail-with-body \
            --dump-header - --output /dev/null "${DEV_ORIGIN}/")
          if ! grep -qi '^location: https://dev\.hakwonplus\.com/dev/inbox' <<<"$ROOT_HEADERS"; then
            echo "::error::Developer console root does not redirect to /dev/inbox"
            exit 1
          fi

          LEGACY_HEADERS=$(curl --silent --show-error --fail-with-body \
            --dump-header - --output /dev/null "https://hakwonplus.com/dev/inbox")
          if ! grep -qi '^location: https://dev\.hakwonplus\.com/dev/inbox' <<<"$LEGACY_HEADERS"; then
            echo "::error::Legacy developer path does not redirect to the isolated origin"
            exit 1
          fi

          HTML=$(curl --silent --show-error --fail-with-body "${DEV_ORIGIN}/dev/inbox")
          if ! grep -q '<link rel="manifest" href="/dev-manifest.json"' <<<"$HTML"; then
            echo "::error::Developer console manifest is not selected at the edge"
            exit 1
          fi
          if ! grep -q 'name="robots" content="noindex, nofollow, noarchive"' <<<"$HTML"; then
            echo "::error::Developer console must remain out of search indexes"
            exit 1
          fi

          MANIFEST=$(curl --silent --show-error --fail-with-body "${DEV_ORIGIN}/dev-manifest.json")
          if [ "$(jq -r '.start_url' <<<"$MANIFEST")" != "/dev/inbox" ]; then
            echo "::error::Developer console manifest has the wrong start_url"
            exit 1
          fi
          echo "✅ Developer console domain isolation verified"

      - name: Roll back production after a failed post-deploy check
        if: failure() && steps.production-deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          BASELINE_DEPLOYMENT_ID: ${{ steps.production-baseline.outputs.deployment_id }}
          BASELINE_VERSION: ${{ steps.production-baseline.outputs.version }}
        run: |
          set -euo pipefail
          ROLLBACK_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/deployments/${BASELINE_DEPLOYMENT_ID}/rollback"
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -X POST \
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
            "${ROLLBACK_API}")
          if ! jq -e '.success == true' >/dev/null <<<"${RESPONSE}"; then
            echo "::error::Cloudflare Pages rollback request failed"
            exit 1
          fi

          for ATTEMPT in $(seq 1 60); do
            ACTUAL_VERSION=$(curl --silent --show-error \
              "https://hakwonplus.com/version.json?rollback=${GITHUB_RUN_ID}-${ATTEMPT}" \
              | jq -r '.version // empty' || true)
            if [ "${ACTUAL_VERSION}" = "${BASELINE_VERSION}" ]; then
              echo "Production rollback verified at ${BASELINE_VERSION}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Rollback was requested but the baseline version did not propagate"
          exit 1

  # ── 3. E2E 왕복 플로우 + 전체 테넌트 공개 화면 가용성 (배포 후) ──
  e2e-roundtrip:
    name: E2E 왕복 테스트 + tenant availability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Tenant 1 (hakwonplus) — production-like test tenant
      E2E_BASE_URL: https://hakwonplus.com
      E2E_API_URL: https://api.hakwonplus.com
      # legacy alias (일부 spec 이 API_BASE_URL 을 참조하던 시기 호환용)
      API_BASE_URL: https://api.hakwonplus.com
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
      E2E_STUDENT_USER: ${{ secrets.E2E_STUDENT_USER }}
      E2E_STUDENT_PASS: ${{ secrets.E2E_STUDENT_PASS }}
      # 운영 side effect 없는 왕복 회귀와 session assessment는 strict 모드 적용 —
      # 배포 후 검증이라 console error 발견 시 즉시 fail 해야 함.
      E2E_STRICT: strict

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download deployed bundle metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deploy-bundle
          path: .deploy-bundle
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Wait for current Cloudflare build to propagate
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('.deploy-bundle/dist/version.json', 'utf8')).version")
          PROBE_NAMES=(
            AdminRouter StudentRouter DashboardPage ClinicPasscardModal
            NoticesPage NoticeDetailPage QnaInboxPage CommunityPage
            ClinicPage ClinicOperationsConsolePage LecturesPage LectureDetailPage
            SessionDetailPage SessionScoresEntryPage SessionAssessmentSidePanel
          )
          PROBE_ASSETS=()
          for NAME in "${PROBE_NAMES[@]}"; do
            mapfile -t MATCHES < <(find .deploy-bundle/dist/assets -maxdepth 1 -type f -name "${NAME}-*.js" -printf '%f\n')
            if [ "${#MATCHES[@]}" -eq 0 ]; then
              echo "::error::Required lazy-route probe asset is missing from deploy bundle: ${NAME}"
              exit 1
            fi
            PROBE_ASSETS+=("${MATCHES[@]}")
          done
          mapfile -t PROBE_ASSETS < <(printf '%s\n' "${PROBE_ASSETS[@]}" | sort -u)
          echo "Checking ${#PROBE_ASSETS[@]} route-critical assets"

          CURL_ARGS=(--connect-timeout 5 -fsS)
          DEADLINE=$((SECONDS + 300))
          ATTEMPT=0
          CONSECUTIVE=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            REMAINING=$((DEADLINE - SECONDS))
            MAX_TIME=$((REMAINING < 15 ? REMAINING : 15))
            ACTUAL_VERSION=$(curl "${CURL_ARGS[@]}" --max-time "$MAX_TIME" "${E2E_BASE_URL}/version.json?deploy_probe=${ATTEMPT}-${RANDOM}" \
              | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||''))}catch{}})" \
              || true)
            READY=true
            if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
              READY=false
            fi
            if [ "$READY" = true ]; then
              # Confirm origin propagation without priming a canonical negative
              # cache entry while the deployment is still incomplete.
              for ASSET in "${PROBE_ASSETS[@]}"; do
                REMAINING=$((DEADLINE - SECONDS))
                if [ "$REMAINING" -le 0 ]; then
                  READY=false
                  break
                fi
                MAX_TIME=$((REMAINING < 15 ? REMAINING : 15))
                if ! curl "${CURL_ARGS[@]}" --max-time "$MAX_TIME" -o /dev/null "${E2E_BASE_URL}/assets/${ASSET}?deploy_probe=${ATTEMPT}-${RANDOM}"; then
                  READY=false
                  break
                fi
              done
            fi
            if [ "$READY" = true ]; then
              # Vite imports use the exact query-less URL. This must also be
              # healthy so a stale edge-cached 404 cannot slip past the gate.
              for ASSET in "${PROBE_ASSETS[@]}"; do
                REMAINING=$((DEADLINE - SECONDS))
                if [ "$REMAINING" -le 0 ]; then
                  READY=false
                  break
                fi
                MAX_TIME=$((REMAINING < 15 ? REMAINING : 15))
                if ! curl "${CURL_ARGS[@]}" --max-time "$MAX_TIME" -o /dev/null "${E2E_BASE_URL}/assets/${ASSET}"; then
                  READY=false
                  break
                fi
              done
            fi

            if [ "$READY" = true ]; then
              CONSECUTIVE=$((CONSECUTIVE + 1))
              echo "Cloudflare propagation check ${ATTEMPT}: ready (${CONSECUTIVE}/3 consecutive)"
              if [ "$CONSECUTIVE" -ge 3 ]; then
                exit 0
              fi
            else
              CONSECUTIVE=0
              echo "Cloudflare propagation check ${ATTEMPT}: waiting"
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -gt 0 ]; then
              SLEEP_FOR=$((REMAINING < 5 ? REMAINING : 5))
              sleep "$SLEEP_FOR"
            fi
          done
          echo "::error::Current Cloudflare build did not stabilize within 300s"
          exit 1

      - name: Run production canary (login smoke)
        run: pnpm test:e2e:canary

      - name: Verify all tenant public screens are open
        run: pnpm verify:tenant-availability

      - name: Run 왕복 플로우 테스트 (차단 게이트)
        run: pnpm exec playwright test e2e/flows/notice-roundtrip.spec.ts e2e/flows/qna-roundtrip.spec.ts e2e/flows/clinic-roundtrip.spec.ts --reporter=list

      - name: Run 차시 성적/시험/과제 실사용 테스트 (차단 게이트)
        run: pnpm exec playwright test e2e/admin/session-assessment-realuse.spec.ts --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  rollback-on-e2e-failure:
    name: Roll back failed production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy, e2e-roundtrip]
    if: >-
      always()
      && needs.deploy.result == 'success'
      && needs.e2e-roundtrip.result == 'failure'

    steps:
      - name: Restore pre-deploy Cloudflare Pages version
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          BASELINE_DEPLOYMENT_ID: ${{ needs.deploy.outputs.baseline_deployment_id }}
          BASELINE_VERSION: ${{ needs.deploy.outputs.baseline_version }}
        run: |
          set -euo pipefail
          if [ -z "${BASELINE_DEPLOYMENT_ID}" ] || [ -z "${BASELINE_VERSION}" ]; then
            echo "::error::Production rollback baseline is missing"
            exit 1
          fi
          ROLLBACK_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/deployments/${BASELINE_DEPLOYMENT_ID}/rollback"
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -X POST \
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
            "${ROLLBACK_API}")
          if ! jq -e '.success == true' >/dev/null <<<"${RESPONSE}"; then
            echo "::error::Cloudflare Pages rollback request failed"
            exit 1
          fi

          for ATTEMPT in $(seq 1 60); do
            ACTUAL_VERSION=$(curl --silent --show-error \
              "https://hakwonplus.com/version.json?rollback=${GITHUB_RUN_ID}-${ATTEMPT}" \
              | jq -r '.version // empty' || true)
            if [ "${ACTUAL_VERSION}" = "${BASELINE_VERSION}" ]; then
              echo "Production rollback verified at ${BASELINE_VERSION}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Rollback was requested but the baseline version did not propagate"
          exit 1
