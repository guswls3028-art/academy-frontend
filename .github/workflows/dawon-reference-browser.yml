name: Dawon admin parity browser

on:
  push:
    branches: [codex/dawon-parity-r50-browser]

permissions:
  contents: read
  actions: read

concurrency:
  group: dawon-parity-r50-browser
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QA_DIR: scripts/dawon-review/r49
    services:
      referencepg:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: qa_hakwonplus_reference
          POSTGRES_USER: reference_qa
          POSTGRES_PASSWORD: fixture-reference-db
        options: --health-cmd "pg_isready -U reference_qa" --health-interval 3s --health-timeout 5s --health-retries 20
      referencecache:
        image: redis:8
      database:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        ports: ['127.0.0.1:5432:5432']
        env:
          POSTGRES_DB: qa_r47
          POSTGRES_USER: dawon
          POSTGRES_PASSWORD: dawon-r47-local-postgres
        options: --health-cmd "pg_isready -U dawon -d qa_r47" --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ['127.0.0.1:6379:6379']
      emulator:
        image: motoserver/moto:5.1.11
        ports: ['127.0.0.1:5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: target
        run: |
          set -euo pipefail
          phase=$(jq -er .phase "$QA_DIR/target.json")
          case "$phase" in private|stage|live) ;; *) exit 2 ;; esac
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
      - if: steps.target.outputs.phase == 'private'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: guswls3028-art/academy-backend
          ref: ce0a2e6d73615b4bc89ab3fbd4a2051e6e27cf1b
          path: backend
          fetch-depth: 2
          persist-credentials: false
      - if: steps.target.outputs.phase == 'private'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 870be1977f5528e192e2564ff9c8db5b86c2d1d5
          path: worker-source
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify sealed frontend artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ steps.target.outputs.phase }}
        run: |
          set -euo pipefail
          build=$(jq -er .dawonRun "$QA_DIR/target.json")
          timeout 14m gh run watch "$build" --exit-status --interval 15
          python "$QA_DIR/verify-builds.py" "$PHASE"
      - name: Prepare previously approved hosted Chromium
        run: |
          pnpm install --frozen-lockfile --shamefully-hoist
          pnpm exec playwright install chromium --with-deps
      - if: steps.target.outputs.phase == 'private'
        name: Start exclusive local synthetic API
        run: |
          set -euo pipefail
          python -m pip install --quiet -r backend/requirements/test.txt
          echo '127.0.0.1 qa-r47-db review-redis review-moto' | sudo tee -a /etc/hosts >/dev/null
          echo "$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${{ job.services.referencepg.id }}") comparison-db" | sudo tee -a /etc/hosts >/dev/null
          echo "$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${{ job.services.referencecache.id }}") comparison-cache" | sudo tee -a /etc/hosts >/dev/null
          bash "$QA_DIR/fixture/start.sh"
          bash "$QA_DIR/reference-start.sh"
          node "$QA_DIR/fixture-origin.cjs" > "$RUNNER_TEMP/dawon-assets.log" 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:18747/version.json >/dev/null
      - name: Exercise original and Dawon roles
        env:
          PHASE: ${{ steps.target.outputs.phase }}
        run: |
          set -euo pipefail
          cd "$QA_DIR"
          if [ "$PHASE" = private ]; then
            mkdir worker
            cp "$GITHUB_WORKSPACE"/worker-source/deploy/dawon/*.mjs worker/
            printf '%s\n' "export default {fetch(){throw new Error('Unexpected legacy fallback in native comparison test')}}" > worker/baseline-worker.mjs
            openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes -keyout "$RUNNER_TEMP/r49-tls.key" -out "$RUNNER_TEMP/r49-tls.crt" -subj '/CN=demo.hakwonplus.com' -addext 'subjectAltName=DNS:demo.hakwonplus.com,DNS:original-demo.hakwonplus.com' 2>/dev/null
            export R49_FIXTURE_SPKI=$(openssl x509 -pubkey -noout -in "$RUNNER_TEMP/r49-tls.crt" | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)
            node fixture-edge.cjs >fixture-browser.log 2>&1 &
            curl --noproxy '*' --connect-to demo.hakwonplus.com:443:127.0.0.1:19449 --cacert "$RUNNER_TEMP/r49-tls.crt" --retry 10 --retry-connrefused --retry-delay 1 -fsS https://demo.hakwonplus.com/version.json >/dev/null
            curl --noproxy '*' --connect-to original-demo.hakwonplus.com:443:127.0.0.1:19449 --cacert "$RUNNER_TEMP/r49-tls.crt" -fsS https://original-demo.hakwonplus.com/login/hakwonplus |
              grep -Fq "$(jq -er .original.entry sealed-builds.json)"
          fi
          node compare-browser.cjs > "$PHASE-browser.log" 2>&1
      - if: always()
        name: Encrypt comparator browser evidence
        run: |
          set -euo pipefail
          cd "$QA_DIR"
          mkdir "$RUNNER_TEMP/r49-evidence"
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*-comparison.json' -o -name '*-browser.log' -o -name 'sealed-builds.json' \) -exec cp {} "$RUNNER_TEMP/r49-evidence/" \;
          cd "$RUNNER_TEMP/r49-evidence"
          tar czf "$RUNNER_TEMP/r49-evidence.tar.gz" .
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/r49-evidence.tar.gz" -outform DER -out "$RUNNER_TEMP/dawon-r49.p7m" "$GITHUB_WORKSPACE/$QA_DIR/proof-recipient.pem"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dawon-r49-browser-evidence
          path: ${{ runner.temp }}/dawon-r49.p7m
          retention-days: 3
          if-no-files-found: error
