name: Weekly Live Visual Audit

on:
  workflow_dispatch:
  schedule:
    # Saturday 04:00 KST. The audit is read-only but intentionally off-peak.
    - cron: "0 19 * * 5"

permissions:
  contents: read

concurrency:
  group: weekly-live-visual-audit
  cancel-in-progress: true

jobs:
  route-surface:
    name: Live visual audit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Guard production E2E safety boundaries
        run: pnpm guard:e2e-safety

      - name: Create read-only live audit environment
        run: |
          cat > .env.e2e << EOF
          E2E_BASE_URL=https://hakwonplus.com
          E2E_LOCAL_BASE_URL=https://hakwonplus.com
          E2E_API_URL=${{ secrets.E2E_API_URL || 'https://api.hakwonplus.com' }}
          E2E_TENANT_CODE=hakwonplus
          E2E_ADMIN_USER=${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASS=${{ secrets.E2E_ADMIN_PASS }}
          E2E_STUDENT_USER=${{ secrets.E2E_STUDENT_USER }}
          E2E_STUDENT_PASS=${{ secrets.E2E_STUDENT_PASS }}
          TCHUL_BASE_URL=https://tchul.com
          E2E_STRICT=strict
          E2E_ALLOW_REAL_ALIMTALK=0
          E2E_ALLOW_PRODUCTION_WRITES=0
          EOF

      - name: Audit live route surface
        run: >-
          pnpm exec playwright test
          e2e/visual/design-system-route-audit.spec.ts
          --project=chromium
          --reporter=github,html
          --retries=0

      - name: Upload route screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-visual-audit-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
