name: Guide media authoring

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Playwright title filter; keep @guide-recording to capture all tutorials"
        required: false
        default: "@guide-recording"
        type: string

permissions:
  contents: read

concurrency:
  group: guide-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --shamefully-hoist
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Record synthetic local UI only
        env:
          GUIDE_MEDIA_CAPTURE: "1"
          E2E_BASE_URL: http://127.0.0.1:5197
          E2E_API_URL: http://127.0.0.1:9
          E2E_STRICT: strict
          E2E_ALLOW_PRODUCTION_WRITES: "0"
          E2E_ALLOW_REAL_ALIMTALK: "0"
          GUIDE_TEST_FILTER: ${{ inputs.test_filter || '@guide-recording' }}
        run: pnpm exec playwright test --config=playwright.guide-recording.config.ts --grep "$GUIDE_TEST_FILTER"
      - name: Package reviewed-source media
        run: node scripts/package-guide-media.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: guide-media-authoring
          path: |
            guide-media-output
            test-results
          retention-days: 7
          if-no-files-found: error
