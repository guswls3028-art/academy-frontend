version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      react-runtime:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tiptap-runtime:
        patterns: ["@tiptap/*"]
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@tiptap/*"
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@tiptap/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
